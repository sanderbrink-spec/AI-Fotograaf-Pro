name: Build AI Fotograaf PRO

on:
  workflow_dispatch:
  push:
    paths:
      - "*.zip"
      - "**/*.zip"
      - ".github/workflows/build-apk.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: ZIP uitpakken
        shell: bash
        run: |
          set -e
          rm -rf project
          mkdir project

          ZIP_FILE=$(find . -maxdepth 3 -type f -iname "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "GEEN ZIP GEVONDEN"
            exit 1
          fi

          echo "ZIP: $ZIP_FILE"
          unzip -q "$ZIP_FILE" -d project

      - name: Android project zoeken
        shell: bash
        run: |
          set -e

          PROJECT_DIR=$(find "$GITHUB_WORKSPACE/project" -name settings.gradle -o -name settings.gradle.kts | head -n 1 | xargs -r dirname)

          if [ -z "$PROJECT_DIR" ]; then
            echo "GEEN ANDROID PROJECT GEVONDEN"
            find "$GITHUB_WORKSPACE/project" -maxdepth 4 -type f
            exit 1
          fi

          echo "PROJECT: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: APK bouwen
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          gradle clean assembleDebug --stacktrace

      - name: APK controleren
        shell: bash
        run: |
          APK=$(find "$PROJECT_DIR/app/build/outputs/apk/debug" -name "*.apk" | head -n 1)

          if [ -z "$APK" ]; then
            echo "APK NIET GEVONDEN"
            exit 1
          fi

          echo "APK GEVONDEN: $APK"

      - name: APK uploaden
        uses: actions/upload-artifact@v4
        with:
          name: AI-Fotograaf-PRO-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
