name: Build AI Fotograaf PRO V6

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: V6 ZIP uitpakken
        run: |
          unzip -q AI_Fotograaf_PRO_V6_CLEAN.zip -d v6
          echo "V6 uitgepakt"
          find v6 -maxdepth 3 -type f | head -50

      - name: APK bouwen
        working-directory: v6
        run: gradle :app:assembleDebug --no-daemon

      - name: APK controleren
        working-directory: v6
        run: test -f app/build/outputs/apk/debug/app-debug.apk

      - name: APK uploaden
        uses: actions/upload-artifact@v4
        with:
          name: AI-Fotograaf-PRO-V6-APK
          path: v6/app/build/outputs/apk/debug/app-debug.apk
