name: Build AI Fotograaf PRO

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Android SDK controleren
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls -la "$ANDROID_HOME"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --version || true

      - name: ZIP uitpakken
        run: |
          set -e
          rm -rf project
          mkdir project

          ZIP_FILE=$(find . -type f -iname "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "GEEN ZIP GEVONDEN"
            exit 1
          fi

          echo "ZIP GEVONDEN: $ZIP_FILE"
          unzip -q "$ZIP_FILE" -d project

      - name: Android project zoeken
        run: |
          set -e

          PROJECT_DIR=$(find "$GITHUB_WORKSPACE/project" \
            \( -name settings.gradle -o -name settings.gradle.kts \) \
            -print -quit | xargs -r dirname)

          if [ -z "$PROJECT_DIR" ]; then
            echo "GEEN ANDROID PROJECT GEVONDEN"
            find project -maxdepth 5 -type f
            exit 1
          fi

          echo "ANDROID PROJECT: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: APK bouwen
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          gradle clean assembleDebug --stacktrace

      - name: APK controleren
        run: |
          find "$PROJECT_DIR/app/build/outputs" -type f -name "*.apk"

      - name: APK uploaden
        uses: actions/upload-artifact@v4
        with:
          name: AI-Fotograaf-PRO-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
