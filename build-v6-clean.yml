name: AI Fotograaf Pro V6 CLEAN

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    name: Build AI Fotograaf Pro V6
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Find clean project ZIP
        shell: bash
        run: |
          set -e
          ZIP=$(find "$GITHUB_WORKSPACE" -maxdepth 1 -type f -name 'AI_Fotograaf_PRO_V6_CLEAN.zip' -print -quit)
          if [ -z "$ZIP" ]; then
            echo 'AI_Fotograaf_PRO_V6_CLEAN.zip not found in repository root.'
            exit 1
          fi
          echo "ZIP=$ZIP" >> "$GITHUB_ENV"

      - name: Extract project
        shell: bash
        run: |
          set -e
          rm -rf project
          mkdir project
          unzip -q "$ZIP" -d project
          test -f project/settings.gradle
          test -f project/build.gradle
          test -f project/app/build.gradle
          test -f project/app/src/main/java/nl/aifotograaf/pro/MainActivity.java

      - name: Build APK
        working-directory: project
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Verify APK
        run: test -f project/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AI-Fotograaf-Pro-V6-CLEAN
          path: project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
