name: AI Fotograaf PRO V6 CLEAN

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build AI Fotograaf PRO V6
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Gradle
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.9-bin.zip
          unzip -q gradle-8.9-bin.zip
          echo "$PWD/gradle-8.9/bin" >> "$GITHUB_PATH"

      - name: Create clean Android project
        shell: bash
        run: |
          rm -rf app gradle build.gradle settings.gradle gradle.properties

          mkdir -p app/src/main/java/nl/aifotograaf/pro
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/mipmap-hdpi
          mkdir -p app/src/main/res/mipmap-mdpi
          mkdir -p app/src/main/res/mipmap-xhdpi
          mkdir -p app/src/main/res/mipmap-xxhdpi
          mkdir -p app/src/main/res/mipmap-xxxhdpi

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "AI Fotograaf PRO V6"
          include(":app")
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=false
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'nl.aifotograaf.pro'
              compileSdk 35

              defaultConfig {
                  applicationId 'nl.aifotograaf.pro'
                  minSdk 26
                  targetSdk 35
                  versionCode 6
                  versionName '6.0'
              }
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <application
                  android:theme="@style/AppTheme"
                  android:label="AI Fotograaf PRO"
                  android:icon="@drawable/ic_camera">

                  <activity
                      android:name=".MainActivity"
                      android:screenOrientation="portrait"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>

                  </activity>

              </application>
          </manifest>
          EOF

          mkdir -p app/src/main/res/values

          cat > app/src/main/res/values/styles.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="AppTheme" parent="android:style/Theme.Material.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:windowLightStatusBar">false</item>
                  <item name="android:statusBarColor">#000000</item>
                  <item name="android:navigationBarColor">#000000</item>
                  <item name="android:colorAccent">#FFFFFF</item>
              </style>
          </resources>
          EOF

          cat > app/src/main/res/drawable/ic_camera.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">

              <path
                  android:fillColor="#000000"
                  android:pathData="M0,0h108v108h-108z"/>

              <path
                  android:fillColor="#FFFFFF"
                  android:pathData="M18,34h20l6,-8h20l6,8h20v48h-72z"/>

              <path
                  android:fillColor="#000000"
                  android:pathData="M54,42a16,16 0,1 0,0 32a16,16 0,1 0,0 -32"/>

              <path
                  android:fillColor="#FFFFFF"
                  android:pathData="M54,47a11,11 0,1 0,0 22a11,11 0,1 0,0 -22"/>

          </vector>
          EOF

          cat > app/src/main/java/nl/aifotograaf/pro/MainActivity.java <<'EOF'
          package nl.aifotograaf.pro;

          import android.app.Activity;
          import android.os.Bundle;
          import android.content.Intent;
          import android.graphics.Bitmap;
          import android.graphics.BitmapFactory;
          import android.graphics.ColorMatrix;
          import android.graphics.ColorMatrixColorFilter;
          import android.graphics.drawable.ColorDrawable;
          import android.net.Uri;
          import android.provider.MediaStore;
          import android.view.Gravity;
          import android.view.View;
          import android.widget.Button;
          import android.widget.ImageView;
          import android.widget.LinearLayout;
          import android.widget.TextView;
          import android.widget.Toast;

          public class MainActivity extends Activity {

              private static final int PICK_IMAGE = 1001;

              private ImageView beforeImage;
              private ImageView afterImage;
              private TextView status;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  LinearLayout root = new LinearLayout(this);
                  root.setOrientation(LinearLayout.VERTICAL);
                  root.setPadding(28, 28, 28, 28);
                  root.setBackgroundColor(Color.BLACK);

                  TextView title = new TextView(this);
                  title.setText("AI FOTOGRAAF PRO");
                  title.setTextColor(Color.WHITE);
                  title.setTextSize(30);
                  title.setGravity(Gravity.CENTER);
                  title.setPadding(0, 10, 0, 8);

                  TextView subtitle = new TextView(this);
                  subtitle.setText("PHOTOS BY LOES • PROFESSIONAL PHOTO STUDIO");
                  subtitle.setTextColor(Color.LTGRAY);
                  subtitle.setTextSize(13);
                  subtitle.setGravity(Gravity.CENTER);
                  subtitle.setPadding(0, 0, 0, 20);

                  Button select = new Button(this);
                  select.setText("SELECTEER FOTO");
                  select.setOnClickListener(v -> selectPhoto());

                  Button improve = new Button(this);
                  improve.setText("AI PERFECT");
                  improve.setEnabled(false);

                  status = new TextView(this);
                  status.setText("Klaar");
                  status.setTextColor(Color.WHITE);
                  status.setTextSize(16);
                  status.setGravity(Gravity.CENTER);
                  status.setPadding(0, 20, 0, 20);

                  LinearLayout comparison = new LinearLayout(this);
                  comparison.setOrientation(LinearLayout.HORIZONTAL);

                  beforeImage = new ImageView(this);
                  afterImage = new ImageView(this);

                  beforeImage.setBackground(new ColorDrawable(Color.DKGRAY));
                  afterImage.setBackground(new ColorDrawable(Color.DKGRAY));

                  beforeImage.setScaleType(ImageView.ScaleType.CENTER_CROP);
                  afterImage.setScaleType(ImageView.ScaleType.CENTER_CROP);

                  comparison.addView(beforeImage,
                          new LinearLayout.LayoutParams(0, 0, 1));

                  comparison.addView(afterImage,
                          new LinearLayout.LayoutParams(0, 0, 1));

                  root.addView(title);
                  root.addView(subtitle);
                  root.addView(select);
                  root.addView(improve);
                  root.addView(status);

                  root.addView(comparison,
                          new LinearLayout.LayoutParams(
                                  LinearLayout.LayoutParams.MATCH_PARENT,
                                  0,
                                  1));

                  setContentView(root);

                  improve.setOnClickListener(v -> {
                      Bitmap source = (Bitmap) beforeImage.getTag();

                      if (source != null) {
                          Bitmap result = improveImage(source);
                          afterImage.setImageBitmap(result);
                          status.setText("AI PERFECT • RESULTAAT KLAAR");
                      }
                  });
              }

              private void selectPhoto() {
                  Intent intent = new Intent(Intent.ACTION_OPEN_DOCUMENT);
                  intent.setType("image/*");
                  intent.addCategory(Intent.CATEGORY_OPENABLE);
                  startActivityForResult(intent, PICK_IMAGE);
              }

              @Override
              protected void onActivityResult(
                      int requestCode,
                      int resultCode,
                      Intent data) {

                  super.onActivityResult(requestCode, resultCode, data);

                  if (requestCode == PICK_IMAGE &&
                          resultCode == RESULT_OK &&
                          data != null &&
                          data.getData() != null) {

                      try {
                          Uri uri = data.getData();

                          Bitmap bitmap =
                                  MediaStore.Images.Media.getBitmap(
                                          getContentResolver(),
                                          uri);

                          beforeImage.setImageBitmap(bitmap);
                          beforeImage.setTag(bitmap);
                          afterImage.setImageBitmap(bitmap);

                          status.setText("Foto geladen • klaar voor AI PERFECT");

                      } catch (Exception e) {
                          Toast.makeText(
                                  this,
                                  "Foto kon niet worden geladen",
                                  Toast.LENGTH_SHORT).show();
                      }
                  }
              }

              private Bitmap improveImage(Bitmap source) {

                  Bitmap result = Bitmap.createBitmap(
                          source.getWidth(),
                          source.getHeight(),
                          Bitmap.Config.ARGB_8888);

                  android.graphics.Canvas canvas =
                          new android.graphics.Canvas(result);

                  ColorMatrix matrix = new ColorMatrix();

                  matrix.setSaturation(1.08f);

                  ColorMatrix contrast = new ColorMatrix(new float[]{
                          1.08f, 0, 0, 0, -8,
                          0, 1.08f, 0, 0, -8,
                          0, 0, 1.08f, 0, -8,
                          0, 0, 0, 1, 0
                  });

                  matrix.postConcat(contrast);

                  android.graphics.Paint paint =
                          new android.graphics.Paint(
                                  android.graphics.Paint.ANTI_ALIAS_FLAG);

                  paint.setColorFilter(
                          new ColorMatrixColorFilter(matrix));

                  canvas.drawBitmap(source, 0, 0, paint);

                  return result;
              }
          }
          EOF

      - name: Build APK
        run: |
          gradle --no-daemon clean assembleDebug

      - name: Check APK
        run: |
          test -f app/build/outputs/apk/debug/app-debug.apk
          ls -lh app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AI-Fotograaf-PRO-V6-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
